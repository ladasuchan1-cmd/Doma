# Testy a nasazení aplikace Půjčovna kol (složka pujcovna-kol/) – podle cyklo-ski-mapa.yml.
#
# Testy běží na každém pushi a PR, který se složky dotkne: npm test (node --test), node --check všech .js, kontrast
# témat, syntaxe deploy/docker-compose.yml (docker compose config) a deploy/Caddyfile (caddy validate v kontejneru).
# Nasazení běží jen po pushi do hlavní větve repa (default branch) a jen když je zapnuté proměnnou repa
# (Settings → Secrets and variables → Actions → Variables):
#   PK_HETZNER = 1  → job `deploy-hetzner`: přes SSH spustí na serveru deploy/hetzner.sh aktualizace; když tam aplikace
#                     ještě není, provede první instalaci (skript pošle přes stdin). Postup: pujcovna-kol/NASAZENI.md.
#   Secrets: HETZNER_HOST, HETZNER_SSH_KEY, volitelně HETZNER_USER (výchozí root; jiný účet potřebuje sudo bez hesla),
#            HETZNER_PORT, PK_ADMIN_PASSWORD (heslo správce mimo demo). Když Půjčovna běží na JINÉM serveru než
#            Cyklo & Ski mapa, použijte varianty s předponou PK_ (PK_HETZNER_HOST, PK_HETZNER_SSH_KEY, PK_HETZNER_USER,
#            PK_HETZNER_PORT) – mají přednost.
#   Variables: PK_HETZNER_DOMAIN (apex doména, výchozí ksprehledy.cz; propisuje se na server),
#              PK_HETZNER_DIR (výchozí /opt/Doma/pujcovna-kol).
name: Půjčovna kol

on:
  push:
    branches: ["**"]
    paths:
      - "pujcovna-kol/**"
      - ".github/workflows/pujcovna-kol.yml"
  pull_request:
    paths:
      - "pujcovna-kol/**"
      - ".github/workflows/pujcovna-kol.yml"
  workflow_dispatch:
    inputs:
      vedle_mapy:
        description: "Nasadit TUTO větev na server vedle Cyklo & Ski mapy (deploy/vedle-mapy.sh aktualizace přes SSH)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pk-pr-{0}', github.ref) || (github.ref_name == github.event.repository.default_branch && 'pk-deploy' || format('pk-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pujcovna-kol
    steps:
      - uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntaxe všech souborů (node --check)
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './public/vendor/*' -not -path './src/vendor/*' -print0 \
            | xargs -0 -n 50 node --check
          sh -n deploy/docker-entrypoint.sh
          bash -n deploy/hetzner.sh

      - name: Jednotkové testy, server, rezervační tok, právní texty
        run: npm test

      - name: Kontrast témat (WCAG AA)
        run: npm run check-contrast

      - name: Docker Compose – validní konfigurace nasazení
        env:
          PK_DOMAIN: ksprehledy.cz
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Caddyfile – validace v kontejneru caddy
        run: |
          docker run --rm -e PK_DOMAIN=ksprehledy.cz -e PK_ACME_EMAIL=info@ksprehledy.cz \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build image (Dockerfile konzistentní s package.json a strukturou)
        run: docker build -f deploy/Dockerfile --build-arg APP_VERSION=ci -t pujcovna-kol:ci .

      - name: Image odpovídá na /api/health
        run: |
          docker run -d --name pk-ci -p 18092:8092 -e PK_DEMO=1 -e PK_RESET_DEMO_HOUR= pujcovna-kol:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18092/api/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs pk-ci | tail -20
          docker rm -f pk-ci >/dev/null
          test "${ok:-0}" = 1

  # Hetzner / jakýkoli VPS s veřejnou adresou: nasazení přes SSH z runneru GitHubu.
  deploy-hetzner:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.PK_HETZNER == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Nasazení přes SSH (hetzner.sh aktualizace, poprvé instalace)
        env:
          HOST: ${{ secrets.PK_HETZNER_HOST || secrets.HETZNER_HOST }}
          USER: ${{ secrets.PK_HETZNER_USER || secrets.HETZNER_USER }}
          PORT: ${{ secrets.PK_HETZNER_PORT || secrets.HETZNER_PORT }}
          KEY: ${{ secrets.PK_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          ADMIN_PASSWORD: ${{ secrets.PK_ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.PK_HETZNER_DOMAIN || 'ksprehledy.cz' }}
          DIR: ${{ vars.PK_HETZNER_DIR }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$HOST" || { echo "Chybí secret HETZNER_HOST (nebo PK_HETZNER_HOST)"; exit 1; }
          test -n "$KEY" || { echo "Chybí secret HETZNER_SSH_KEY (nebo PK_HETZNER_SSH_KEY)"; exit 1; }
          mkdir -p ~/.ssh
          # Klíč vložený ze schránky (Windows) mívá CRLF, BOM, mezery na koncích řádků nebo je slepený do jednoho
          # řádku – OpenSSH ho pak odmítne („error in libcrypto“). Vezme se jen tělo mezi BEGIN a END a znovu zalomí.
          raw="$(printf '%s\n' "$KEY" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r')"
          typ="$(printf '%s\n' "$raw" | grep -o -m1 'BEGIN [A-Z0-9 ]*PRIVATE KEY' | sed 's/^BEGIN //')"
          if [ -z "$typ" ]; then
            echo "Secret HETZNER_SSH_KEY neobsahuje soukromý klíč (chybí řádek -----BEGIN … PRIVATE KEY-----)."
            echo "Vložte celý obsah souboru pk-deploy (bez přípony .pub), od řádku BEGIN po řádek END."
            exit 1
          fi
          body="$(printf '%s\n' "$raw" | sed -e 's/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----//' -e 's/-----END [A-Z0-9 ]*PRIVATE KEY-----//' | tr -d '[:space:]')"
          { echo "-----BEGIN $typ-----"; printf '%s\n' "$body" | fold -w 70; echo "-----END $typ-----"; } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! chyba="$(ssh-keygen -y -P "" -f ~/.ssh/id_deploy 2>&1 >/dev/null)"; then
            echo "Secret HETZNER_SSH_KEY není použitelný klíč: $chyba"
            echo "Zmiňuje-li hláška passphrase, je klíč chráněný heslem: vygenerujte nový bez passphrase (postup v NASAZENI.md) a nahrajte veřejný na server i soukromý do secretu znovu."
            exit 1
          fi
          echo "Klíč v pořádku, otisk: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          APP="${DIR:-/opt/Doma/pujcovna-kol}"
          REPO_DIR="$(dirname "$APP")"
          SUDO=""; [ "${USER:-root}" != "root" ] && SUDO="sudo -n"
          ssh_cmd() { ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o StrictHostKeyChecking=yes "${USER:-root}@$HOST" "$@"; }
          # Heslo správce jde na server v base64 (bez starostí s uvozovkami); prázdné = nechat demo výchozí.
          PWD_B64="$(printf %s "$ADMIN_PASSWORD" | base64 -w0)"
          # Skript se posílá přes stdin z právě nasazovaného commitu: kdyby se spouštěl ten na serveru, běžela by
          # jeho předchozí verze (soubor se aktualizuje až uvnitř běhu) a změny ve skriptu by platily o nasazení později.
          if ssh_cmd "$SUDO test -f '$APP/deploy/.env'"; then
            echo "→ Aplikace je nainstalovaná – aktualizuji (doména a heslo správce podle nastavení GitHubu, jsou-li vyplněné)."
            ssh_cmd "$SUDO env PK_DOMAIN='$DOMAIN' PK_ADMIN_PASSWORD=\"\$(printf %s '$PWD_B64' | base64 -d)\" PK_REPO_DIR='$REPO_DIR' bash -s -- aktualizace" < pujcovna-kol/deploy/hetzner.sh
          else
            echo "→ Aplikace na serveru není – první instalace na doméně $DOMAIN."
            ssh_cmd "$SUDO env PK_DOMAIN='$DOMAIN' PK_ADMIN_PASSWORD=\"\$(printf %s '$PWD_B64' | base64 -d)\" PK_REPO_DIR='$REPO_DIR' PK_VETEV='$BRANCH' bash -s -- instalace '$DOMAIN'" < pujcovna-kol/deploy/hetzner.sh
          fi

  # Server, kde půjčovna běží VEDLE Cyklo & Ski mapy (37.27.203.154, NASAZENI.md kap. 7b): ruční spuštění workflow
  # s volbou „vedle_mapy“ nasadí právě tuto větev – pošle deploy/vedle-mapy.sh přes stdin a spustí „aktualizace“
  # (fetch + ff-merge větve na serveru, build image, výměna kontejneru, reload Caddy mapy). Stejné SSH secrets jako
  # u mapy (HETZNER_HOST, HETZNER_SSH_KEY, …). Volitelný secret PK_NABIDKA_INTERNI_JSON (obsah interního ceníku
  # s nákupními cenami kol, NASAZENI.md kap. 6b) se zapíše do datového svazku jako /data/nabidka.interni.json –
  # nikdy do repa ani do logu.
  deploy-vedle-mapy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.vedle_mapy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pk-deploy-vedle-mapy
    steps:
      - uses: actions/checkout@v5
      - name: Nasazení přes SSH (vedle-mapy.sh aktualizace)
        env:
          HOST: ${{ secrets.PK_HETZNER_HOST || secrets.HETZNER_HOST }}
          USER: ${{ secrets.PK_HETZNER_USER || secrets.HETZNER_USER }}
          PORT: ${{ secrets.PK_HETZNER_PORT || secrets.HETZNER_PORT }}
          KEY: ${{ secrets.PK_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          INTERNI_JSON: ${{ secrets.PK_NABIDKA_INTERNI_JSON }}
          DOMAIN: ${{ vars.PK_HETZNER_DOMAIN || 'ksprehledy.cz' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$HOST" || { echo "Chybí secret HETZNER_HOST (nebo PK_HETZNER_HOST)"; exit 1; }
          test -n "$KEY" || { echo "Chybí secret HETZNER_SSH_KEY (nebo PK_HETZNER_SSH_KEY)"; exit 1; }
          mkdir -p ~/.ssh
          raw="$(printf '%s\n' "$KEY" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r')"
          typ="$(printf '%s\n' "$raw" | grep -o -m1 'BEGIN [A-Z0-9 ]*PRIVATE KEY' | sed 's/^BEGIN //')"
          test -n "$typ" || { echo "Secret HETZNER_SSH_KEY neobsahuje soukromý klíč."; exit 1; }
          body="$(printf '%s\n' "$raw" | sed -e 's/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----//' -e 's/-----END [A-Z0-9 ]*PRIVATE KEY-----//' | tr -d '[:space:]')"
          { echo "-----BEGIN $typ-----"; printf '%s\n' "$body" | fold -w 70; echo "-----END $typ-----"; } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null || { echo "Secret HETZNER_SSH_KEY není použitelný klíč."; exit 1; }
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SUDO=""; [ "${USER:-root}" != "root" ] && SUDO="sudo -n"
          ssh_cmd() { ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o StrictHostKeyChecking=yes "${USER:-root}@$HOST" "$@"; }
          echo "→ Větev $BRANCH → server (vedle Cyklo & Ski mapy)"
          ssh_cmd "$SUDO env PK_VETEV='$BRANCH' PK_DOMAIN='$DOMAIN' bash -s -- aktualizace" < pujcovna-kol/deploy/vedle-mapy.sh
          if [ -n "$INTERNI_JSON" ]; then
            echo "→ Zapisuji interní ceník (secret PK_NABIDKA_INTERNI_JSON) do svazku pujcovna-kol_data (obsah se neloguje)."
            printf '%s' "$INTERNI_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{JSON.parse(s);})' || { echo "PK_NABIDKA_INTERNI_JSON není platný JSON"; exit 1; }
            B64="$(printf '%s' "$INTERNI_JSON" | base64 -w0)"
            ssh_cmd "$SUDO docker run --rm -i -v pujcovna-kol_data:/data alpine sh -c 'base64 -d > /data/nabidka.interni.json.tmp && mv /data/nabidka.interni.json.tmp /data/nabidka.interni.json && chown 1000:1000 /data/nabidka.interni.json && chmod 600 /data/nabidka.interni.json'" <<< "$B64"
          else
            echo "→ Secret PK_NABIDKA_INTERNI_JSON není nastaven – interní ceník na serveru se nemění."
          fi
          ssh_cmd "$SUDO bash /opt/Doma/pujcovna-kol/deploy/vedle-mapy.sh stav" || true
          for h in www outdoor sport family; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$h.$DOMAIN/nabidka" || true)"
            echo "https://$h.$DOMAIN/nabidka → $code"
          done
