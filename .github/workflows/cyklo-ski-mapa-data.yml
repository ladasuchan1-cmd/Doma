# DOČASNÝ TEST (jen ve větvi csm-test-qlever, nikdy nesloučit): odpovídá QLever runneru GitHubu a serveru Hetzner?
name: Cyklo & Ski mapa – obnova dat

on:
  workflow_dispatch:
    inputs:
      weby:
        description: "nepoužito"
        type: choice
        options: [nova, vse, zadne]
        default: nova

permissions:
  contents: read

jobs:
  test-qlever:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: QLever z runneru a přes server
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_PORT }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          echo "runner stats: $(curl -sS -o /dev/null -w '%{http_code}' 'https://qlever.dev/api/osm-planet?cmd=stats')"
          mkdir -p ~/.ssh
          raw="$(printf '%s\n' "$KEY" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r')"
          typ="$(printf '%s\n' "$raw" | grep -o -m1 'BEGIN [A-Z0-9 ]*PRIVATE KEY' | sed 's/^BEGIN //')"
          body="$(printf '%s\n' "$raw" | sed -e 's/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----//' -e 's/-----END [A-Z0-9 ]*PRIVATE KEY-----//' | tr -d '[:space:]')"
          { echo "-----BEGIN $typ-----"; printf '%s\n' "$body" | fold -w 70; echo "-----END $typ-----"; } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o StrictHostKeyChecking=yes "${USER:-root}@$HOST" 'bash -s' <<'SKRIPT'
          command -v curl >/dev/null || { echo "curl na serveru chybí"; exit 0; }
          echo "server stats: $(curl -sS -o /dev/null -w '%{http_code}' 'https://qlever.dev/api/osm-planet?cmd=stats')"
          echo "server dotaz: $(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: text/csv' --data-urlencode 'query=SELECT ?x WHERE { ?x ?y ?z } LIMIT 1' https://qlever.dev/api/osm-planet)"
          SKRIPT
