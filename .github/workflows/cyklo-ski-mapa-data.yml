# Týdenní obnova dat Cyklo & Ski mapy (každé pondělí): stáhne nové trasy, sjezdovky a místa z OpenStreetMap,
# OpenSkiMap a ČÚZK, projde weby míst a výsledek commitne do hlavní větve repa. Po commitu spustí
# workflow „Cyklo & Ski mapa“ (testy + nasazení), protože pushe z Actions ho samy nespouštějí.
# Weby: první pondělí v měsíci se projdou znovu všechny (≈30 min), ostatní pondělky jen místa, která údaje
# z webu ještě nemají. Ručně tlačítkem „Run workflow“ s volbou, které weby projít.
name: Cyklo & Ski mapa – obnova dat

on:
  schedule:
    - cron: "17 3 * * 1"   # každé pondělí 3:17 UTC (5:17 letního, 4:17 zimního času)
  workflow_dispatch:
    inputs:
      weby:
        description: "Weby míst: nova = jen místa bez údajů z webu, vse = znovu všechny (≈30 min), zadne = bez webů"
        type: choice
        options: [nova, vse, zadne]
        default: nova

permissions:
  contents: write
  actions: write

concurrency:
  group: csm-data
  cancel-in-progress: false

jobs:
  obnova:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Hlavní větev repa
        id: vetev
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "nazev=$(gh repo view ${{ github.repository }} --json defaultBranchRef -q .defaultBranchRef.name)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.vetev.outputs.nazev }}

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sestavení dat (nové stažení zdrojů)
        working-directory: cyklo-ski-mapa
        run: node tools/build-data.js --fetch

      - name: Průchod webů míst
        working-directory: cyklo-ski-mapa
        env:
          UDALOST: ${{ github.event_name }}
          VOLBA: ${{ inputs.weby }}
        run: |
          rezim="$VOLBA"
          if [ "$UDALOST" = "schedule" ]; then
            # první pondělí v měsíci (den 1–7) projde znovu všechny weby, ostatní pondělky jen nová místa
            if [ "$(date -u +%-d)" -le 7 ]; then rezim=vse; else rezim=nova; fi
          fi
          case "$rezim" in
            vse)  node tools/enrich-web.js --force --concurrency 10 ;;
            nova) node tools/enrich-web.js --concurrency 10 ;;
            *)    echo "Weby se tentokrát neprocházejí." ;;
          esac

      - name: Testy nad novými daty
        working-directory: cyklo-ski-mapa
        run: npm test

      - name: Commit a push
        id: commit
        working-directory: cyklo-ski-mapa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.js
          if git diff --cached --quiet; then
            echo "Žádná změna dat."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Cyklo & Ski mapa: obnova dat ($(date +%Y-%m-%d))"
          git push origin "HEAD:${{ steps.vetev.outputs.nazev }}"
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Spustit testy a nasazení nad novými daty
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cyklo-ski-mapa.yml --ref "${{ steps.vetev.outputs.nazev }}"
