# Testy Kolomapy (složka kolomapa/) – offline nad uloženými ukázkami stránek, bez stahování z webů.
# Matice: nejstarší podporovaný Node (22.13), aktuální LTS a Windows (cílová platforma obchodu – ověří i
# uvozovky v `npm test` pod cmd.exe a dávkové soubory start.cmd / stahnout.cmd).
name: Kolomapa

on:
  push:
    branches: ["**"]
    paths:
      - "kolomapa/**"
      - ".github/workflows/kolomapa.yml"
  pull_request:
    paths:
      - "kolomapa/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13.0" }
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    defaults:
      run:
        working-directory: kolomapa
    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Testy
        run: npm test

      # Dávkové soubory pro majitele obchodu: musí jít spustit ve skutečném cmd.exe (CRLF, uvozovky, návratové kódy).
      - name: start.cmd a stahnout.cmd (jen nápověda, nic nestahuje)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start.cmd --help || exit /b 1
          call stahnout.cmd --help || exit /b 1
          type data\stahovani.log
