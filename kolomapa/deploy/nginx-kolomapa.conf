# Kolomapa za nginx – jen když na serveru už nginx běží (jinak použijte Caddy přes deploy/instalace.sh).
# 1) Nahraďte mapa.example.cz svou doménou a soubor uložte do /etc/nginx/sites-available/kolomapa
# 2) ln -s /etc/nginx/sites-available/kolomapa /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 3) HTTPS: apt install certbot python3-certbot-nginx && certbot --nginx -d mapa.example.cz
# V nastaveni.txt Kolomapy musí být KOLOMAPA_TRUST_PROXY=1 (adresa návštěvníka pro ochranu proti hádání hesla).
server {
    listen 80;
    listen [::]:80;
    server_name mapa.example.cz;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # jen adresa návštěvníka (ne $proxy_add_x_forwarded_for – tu by šlo podvrhnout hlavičkou od klienta)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
