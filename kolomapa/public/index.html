<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="Kolomapa – inzeráty použitých kol z Bazoše, Sbazaru, Aukra a Cyklobazaru na mapě ČR s odhadem tržní ceny.">
  <title>Kolomapa</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="vendor/markercluster/leaflet.markercluster.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#panel">Přeskočit na seznam inzerátů</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Kolomapa – celá ČR">
      <img src="favicon.svg" alt="" width="26" height="26">
      <span>Kolomapa</span>
    </a>
    <div class="topbar__info" id="status" aria-live="polite"></div>
    <div class="topbar__actions" id="run-actions"></div>
  </header>
  <main class="layout">
    <section class="mapwrap" aria-label="Mapa inzerátů">
      <div id="map" class="map"></div>
      <button type="button" id="btn-cr" class="map-btn" hidden>Celá ČR</button>
      <div id="legend" class="legend" aria-label="Legenda mapy"></div>
    </section>
    <aside class="sidebar" aria-label="Inzeráty">
      <div id="panel" class="panel" tabindex="-1"></div>
      <div id="detail" class="detail" role="dialog" aria-labelledby="detail-title" hidden></div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Kolomapa potřebuje zapnutý JavaScript.</p></noscript>
</body>
</html>
