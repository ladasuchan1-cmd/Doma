<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boubínské rodinné kvízování 4</title>
<style>
:root{--ink:#14161a;--ink-2:#1e2128;--paper:#f2efe9;--red:#d6371f;--blue:#2749b8;--ochre:#e5a50a;--line:#3a3f4a;--muted:#9aa1ad}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;overflow:hidden}
#stage{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}
#stage>header{grid-row:1}
#stage>#pickinfo{grid-row:2}
#stage>main{grid-row:3;min-height:0}
#stage>footer{grid-row:4}
header{display:flex;border-bottom:2px solid var(--line)}
.mark{padding:13px 22px;border-right:2px solid var(--line);display:flex;align-items:center;gap:14px;letter-spacing:-.02em}
.mark b{font-size:17px}.mark span{color:var(--muted);font-size:14px}
.roundtag{padding:13px 22px;display:flex;align-items:center;font-weight:700;font-size:17px;border-right:2px solid var(--line);letter-spacing:-.02em}
.roundtag i{font-style:normal;width:26px;height:26px;margin-right:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px}
.counter{margin-left:auto;padding:13px 22px;display:flex;align-items:center;color:var(--muted);font-size:15px}
main{position:relative;display:grid;place-items:center;padding:26px}
.slide.light{background-color:#f5f2ec;background-size:cover;background-position:center;
  margin:-26px;padding:34px 46px;min-height:100%;display:none;align-content:center}
.slide.light.on{display:grid}
.slide.light,.slide.light .big h1,.slide.light .qtext,.slide.light .opt,.slide.light .sol .a{color:#1f2933}
.slide.light .big h1 em{color:#8a6d1f}
.slide.light .big p,.slide.light .sol .q,.slide.light .sol .e,.slide.light .reveal .n{color:#5a6470}
.slide.light .hintlabel{color:#8a6d1f;border-top-color:#c9c2b4}
.slide.light .opt{border-left-color:#c9c2b4}
.slide.light .opt b{color:#8a6d1f}
.slide.light .reveal{border-color:#8a6d1f;background:rgba(255,255,255,.72)}
.slide.light .reveal .e{color:#1f2933}
.slide.light .sol .row{border-bottom-color:#c9c2b4}
.slide.light .sol .row:first-child{border-top-color:#c9c2b4}
.slide.light .clock.low{color:#b33018}
#pickinfo{background:#22262e;border-bottom:2px solid var(--line);padding:10px 22px;font-size:14px;color:var(--ochre);line-height:1.4}
.slide{display:none;width:100%;max-width:1180px}
.slide.on{display:block}
.big{max-width:940px;margin:0 auto}
.big h1{font-size:clamp(36px,6vw,80px);line-height:.98;letter-spacing:-.035em;font-weight:700}
.big h1 em{font-style:normal;display:block;color:var(--ochre)}
.big p{margin-top:24px;font-size:clamp(16px,1.7vw,21px);color:var(--muted);max-width:62ch;line-height:1.5}
.keys{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px}
.key{border:2px solid var(--line);padding:9px 14px;font-size:14px}
.key b{color:var(--ochre);font-weight:700}
.qwrap{display:grid;gap:26px}
.qhead{display:flex;gap:8px;align-items:center}
.badge{font-size:13px;font-weight:700;padding:6px 11px;color:#fff}
.b-d2{background:#2f7d4f}.b-d3{background:#7d6a2f}.b-d4{background:#b5541c}.b-d5{background:var(--red)}
.b-tag{background:var(--blue)}
.qtext{font-size:clamp(28px,3.9vw,50px);line-height:1.08;letter-spacing:-.03em;font-weight:700;max-width:24ch}
.opts{display:grid;gap:12px;max-width:820px}
.opts.hidden{display:none}
.opt{display:flex;gap:16px;align-items:baseline;border-left:6px solid var(--line);padding:10px 0 10px 16px;font-size:clamp(18px,2.1vw,26px)}
.opt b{color:var(--ochre);min-width:26px}
.hintlabel{font-size:14px;font-weight:700;color:var(--ochre);border-top:2px solid var(--line);padding-top:14px}
.reveal{border:2px solid var(--ochre);padding:16px 20px;display:none;max-width:820px}
.reveal.on{display:block}
.reveal .t{font-size:clamp(20px,2.4vw,30px);font-weight:700;letter-spacing:-.02em}
.reveal .n{margin-top:6px;color:var(--muted);font-size:16px}
.mediagrid{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
.frame{background:#000;border:2px solid var(--line);position:relative;aspect-ratio:16/9;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
.cover{position:absolute;inset:0;background:var(--ink-2);display:grid;place-items:center}
.cover.off{display:none}
.cover .inner{display:grid;justify-items:center;gap:20px}
.play{width:92px;height:92px;border-radius:50%;background:var(--red);display:grid;place-items:center;cursor:pointer}
.play::after{content:"";border-left:29px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;margin-left:7px}
.meter{display:flex;align-items:flex-end;gap:7px;height:92px}
.meter span{width:14px;background:var(--ochre);height:16px}
.playing .meter span{animation:bump .9s ease-in-out infinite}
.playing .meter span:nth-child(2){animation-duration:.7s}
.playing .meter span:nth-child(3){animation-duration:1.15s}
.playing .meter span:nth-child(4){animation-duration:.8s}
.playing .meter span:nth-child(5){animation-duration:1s}
@keyframes bump{0%,100%{height:16px}50%{height:88px}}
@media (prefers-reduced-motion:reduce){.playing .meter span{animation:none;height:52px}}
.cover p{color:var(--muted);font-size:15px;text-align:center;max-width:34ch;line-height:1.5;margin-top:4px}
.err{position:absolute;inset:0;display:none;place-items:center;background:var(--ink-2);padding:28px;z-index:3}
.err.on{display:grid}
.err div{max-width:48ch;text-align:center;font-size:15px;line-height:1.55}
.err code{color:var(--ochre)}
.errbtns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.errbtns button{border:2px solid var(--line);padding:9px 14px;font-size:14px}
.clock{font-size:clamp(90px,20vw,240px);font-weight:700;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.sol{display:grid;gap:0;max-width:1000px}
.sol .row{display:grid;grid-template-columns:44px 1fr 1fr;gap:18px;padding:13px 0;border-bottom:2px solid var(--line);align-items:baseline}
.sol .row:first-child{border-top:2px solid var(--line)}
.sol .n{color:var(--muted);font-weight:700}
.sol .q{font-size:17px;line-height:1.3;color:var(--muted)}
.sol .a{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.sol .e{font-size:14px;line-height:1.45;color:var(--muted);grid-column:2/4;margin-top:-4px}
.sol .row{grid-template-columns:44px 1fr 1.15fr}
.reveal .e{margin-top:12px;font-size:16px;line-height:1.5;color:var(--paper);max-width:70ch}
.tools{display:flex;gap:0;margin-top:18px;flex-wrap:wrap}
.tools button{border:2px solid var(--line);padding:9px 14px;font-size:14px;margin-right:10px}
table.score td.here{background:#22262e}
table.score{border-collapse:collapse;width:100%;max-width:960px}
table.score th,table.score td{border:2px solid var(--line);padding:10px 12px;text-align:left;font-size:17px}
table.score th{color:var(--muted);font-weight:700;font-size:14px}
table.score input{width:100%;background:transparent;border:0;color:var(--paper);font:inherit;font-size:17px}
table.score input:focus{outline:2px solid var(--ochre)}
table.score td.total{font-weight:700;color:var(--ochre);font-variant-numeric:tabular-nums}
footer{border-top:2px solid var(--line);display:flex}
button{font:inherit;font-size:15px;font-weight:700;color:var(--paper);background:transparent;border:0;border-right:2px solid var(--line);padding:15px 22px;cursor:pointer}
button:hover{background:var(--ink-2)}
button:focus-visible{outline:3px solid var(--ochre);outline-offset:-3px}
button.primary{background:var(--red)}
button.primary:hover{background:#b92c17}
button:disabled{color:#5b616d;cursor:default;background:transparent}
.spacer{margin-left:auto;border:0}
@media (max-width:900px){.mediagrid{grid-template-columns:1fr}.sol .row{grid-template-columns:32px 1fr}.sol .q{display:none}}
</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div id="stage">
  <header>
    <div class="mark"><b>Boubínské rodinné kvízování 4</b><span id="sub">10 okruhů</span></div>
    <div class="roundtag" id="roundtag"><i>1</i><span>Úvod</span></div>
    <div class="counter" id="counter"></div>
  </header>
  <div id="pickinfo" hidden></div>
  <main id="main"></main>
  <footer>
    <button class="primary" id="btnA">Přehrát</button>
    <button id="btnB">S klipem</button>
    <button id="btnHint">Nápověda</button>
    <button id="btnAnswer">Odpověď</button>
    <button class="spacer" id="btnPrev">Zpět</button>
    <button id="btnNext">Další</button>
    <button id="btnFull">Celá obrazovka</button>
    <button id="btnPick">Načíst složku s médii</button>
    <input id="pick" type="file" multiple webkitdirectory directory hidden>
    <input id="pickone" type="file" accept="video/*,audio/*" hidden>
  </footer>
</div>
<script>
const BLOCKS = [[{"name": "Geografie", "items": [{"t": "q", "d": 2, "q": "Jaké je hlavní město Turecka?", "o": ["Istanbul", "Ankara", "Izmir"], "a": "Ankara", "n": "", "e": "Ankara se stala hlavním městem roku 1923 po vzniku republiky. Istanbul je větší i známější, Atatürk ale chtěl centrum uvnitř země."}, {"t": "q", "d": 3, "q": "Jaké je hlavní město Brazílie?", "o": ["Rio de Janeiro", "Brasília", "São Paulo"], "a": "Brasília", "n": "", "e": "Brasília byla postavena na zelené louce a otevřena roku 1960. Půdorys připomíná letadlo, navrhli ji Lúcio Costa a Oscar Niemeyer."}, {"t": "q", "d": 3, "q": "Jaké je hlavní město Nového Zélandu?", "o": ["Auckland", "Wellington", "Christchurch"], "a": "Wellington", "n": "", "e": "Wellington je nejjižnější hlavní město mezi nezávislými státy. Auckland je několikanásobně větší, vláda ale sídlí ve Wellingtonu od roku 1865."}, {"t": "q", "d": 4, "q": "Jaké je hlavní město Nigérie?", "o": ["Lagos", "Abuja", "Kano"], "a": "Abuja", "n": "", "e": "Abuja byla postavena v 80. letech uprostřed země a hlavním městem je od roku 1991. Lagos zůstal největším městem a hospodářským centrem."}, {"t": "q", "d": 5, "q": "Jaké je hlavní město Myanmaru?", "o": ["Rangún", "Neipyijto", "Mandalaj"], "a": "Neipyijto", "n": "", "e": "Barmská vojenská vláda město vybudovala v ústraní a úřady tam přesunula roku 2005. Proslulo prázdnými mnohaproudými silnicemi."}]}, {"name": "Fauna", "items": [{"t": "q", "d": 2, "q": "Která kočkovitá šelma je největší v Americe?", "o": ["Jaguár", "Puma", "Ocelot"], "a": "Jaguár", "n": "", "e": "Jaguár je největší kočkovitá šelma Ameriky a žije od Mexika po Argentinu. Na rozdíl od leoparda má uvnitř skvrn ještě tmavé tečky."}, {"t": "q", "d": 3, "q": "Který pták umí létat pozpátku?", "o": ["Kolibřík", "Vlaštovka", "Rorýs"], "a": "Kolibřík", "n": "", "e": "Kolibřík jako jediný pták umí létat pozpátku i viset na místě. Křídly kmitá až osmdesátkrát za sekundu."}, {"t": "q", "d": 3, "q": "Jak se jmenuje mládě labutě?", "o": ["Labuťátko", "Housátko", "Kachňátko"], "a": "Labuťátko", "n": "", "e": "Mládě labutě je labuťátko a první rok je šedé. Bílé peří získává až ve druhém roce života."}, {"t": "q", "d": 4, "q": "Který had je nejtěžší na světě?", "o": ["Anakonda velká", "Krajta mřížkovaná", "Hroznýš královský"], "a": "Anakonda velká", "n": "", "e": "Anakonda velká je nejtěžší had světa, váží přes dvě stě kilogramů. Krajta mřížkovaná bývá delší, je ale mnohem štíhlejší."}, {"t": "q", "d": 5, "q": "Jak se jmenuje poslední ze čtyř oddílů žaludku přežvýkavců?", "o": ["Bachor", "Kniha", "Slez"], "a": "Slez", "n": "", "e": "Pořadí je bachor, čepec, kniha a slez. Teprve ve slezu probíhá trávení podobné tomu našemu, předchozí oddíly slouží ke kvašení."}]}], [{"name": "Film", "media": "videos/", "items": [{"t": "m", "d": 2, "q": "Z jakého filmu je ukázka, z jakého je roku a kdo ho režíroval?", "f": ["TERMINÁTOR_2.mp4", "TERMINATOR_2.mp4", "terminator 2.mp4"], "a": "Terminátor 2", "n": "Rok: 1991 · Režie: James Cameron", "b": "Bod za název, bod za rok, bod za režiséra.", "o": ["Terminátor 2", "RoboCop", "Total Recall"], "open": true, "tag": "Světová", "e": "Schwarzenegger si tentokrát zahrál hodného terminátora chránícího chlapce. Film proslavil tekutý kov T-1000, jeden z prvních velkých počítačových efektů."}, {"t": "m", "d": 2, "q": "Z jakého českého filmu je ukázka, z jakého je roku a kdo ho režíroval?", "f": ["coz_takhle_dat_si_spenat.mp4"], "a": "Což takhle dát si špenát", "n": "Rok: 1977 · Režie: Václav Vorlíček", "b": "Bod za název, bod za rok, bod za režiséra.", "o": ["Což takhle dát si špenát", "Zítra vstanu a opařím se čajem", "Adéla ještě nevečeřela"], "open": true, "tag": "Česká", "e": "Komedie o omlazovacím přístroji, kde Iva Janžurová hraje dvojroli. Vorlíček ji natočil v období svých nejlepších bláznivých komedií."}, {"t": "m", "d": 4, "q": "Z jakého českého seriálu je ukázka, z jakého je roku a kdo ho režíroval?", "f": ["most.mp4"], "a": "Most!", "n": "Rok: 2019 · Režie: Jan Prušinovský", "b": "Bod za název, bod za rok, bod za režiséra.", "o": ["Most!", "Okresní přebor", "Vyprávěj"], "open": true, "tag": "Česká", "e": "Seriál z mosteckého sídliště s Martinem Hofmannem v hlavní roli. Vyvolal debatu o tom, kam až smí komedie zajít s předsudky."}, {"t": "m", "d": 4, "q": "Z jakého filmu je ukázka, z jakého je roku a kdo ho režíroval?", "f": ["sberatele_kosti.mp4"], "a": "Sběratelé kostí", "n": "Rok: 1999 · Režie: Phillip Noyce", "b": "Bod za název, bod za rok, bod za režiséra.", "o": ["Sběratelé kostí", "Sedm", "Mlčení jehňátek"], "open": true, "tag": "Světová", "e": "Denzel Washington hraje ochrnutého kriminalistu, Angelina Jolie jeho oči v terénu. Thriller vyšel ve stejné vlně jako Sedm a bývá s ním zaměňován."}, {"t": "m", "d": 5, "q": "Z jakého českého filmu je ukázka, z jakého je roku a kdo ho režíroval?", "f": ["jak_dostat_tatinka_do_polepsovny.mp4"], "a": "Jak dostat tatínka do polepšovny", "n": "Rok: 1978 · Režie: Marie Poledňáková", "b": "Bod za název, bod za rok, bod za režiséra.", "o": ["Jak dostat tatínka do polepšovny", "Marečku, podejte mi pero!", "S tebou mě baví svět"], "open": true, "tag": "Česká", "e": "Pokračování filmu Jak vytrhnout velrybě stoličku s Tomášem Holým. Poledňáková s ním natočila jedny z nejúspěšnějších rodinných filmů své doby."}]}, {"name": "Flóra", "items": [{"t": "q", "d": 2, "q": "Která masožravá rostlina roste i v českých rašeliništích?", "o": ["Rosnatka okrouhlolistá", "Mucholapka podivná", "Láčkovka"], "a": "Rosnatka okrouhlolistá", "n": "", "e": "Rosnatka roste na rašeliništích, kde je málo dusíku, a doplňuje si ho lovem hmyzu. Lepkavé kapky na listech vypadají jako rosa, odtud jméno."}, {"t": "q", "d": 3, "q": "Ze které rostliny se vyrábí tequila?", "o": ["Agáve", "Kaktus", "Cukrová třtina"], "a": "Agáve", "n": "", "e": "Tequila se vyrábí z modré agáve z okolí mexického města Tequila. Agáve není kaktus, ale příbuzná chřestu."}, {"t": "q", "d": 3, "q": "Která rostlina má největší květ na světě?", "o": ["Rafflesie", "Viktorie královská", "Titánovec"], "a": "Rafflesie", "n": "", "e": "Květ rafflesie dosahuje průměru přes metr a váží několik kilogramů. Rostlina nemá listy ani stonek, cizopasí na liánách a láká mouchy zápachem po mršině."}, {"t": "q", "d": 4, "q": "Která rostlina roste na světě nejrychleji?", "o": ["Bambus", "Eukalyptus", "Slunečnice"], "a": "Bambus", "n": "", "e": "Některé druhy bambusu vyrostou o víc než metr za den. Bambus přitom není strom, ale tráva."}, {"t": "q", "d": 5, "q": "Jak se jmenuje nejmenší kvetoucí rostlina světa?", "o": ["Drobnička (Wolffia)", "Okřehek", "Rašeliník"], "a": "Drobnička (Wolffia)", "n": "", "e": "Drobnička je bezkořenná vodní rostlinka velikosti zrnka písku. Přesto kvete, a to nejmenšími květy na světě."}]}], [{"name": "Stalo se", "items": [{"t": "q", "d": 2, "q": "Ve kterém roce byla založena Organizace spojených národů?", "o": ["1919", "1945", "1949"], "a": "1945", "n": "", "e": "Charta OSN byla podepsána v San Francisku v červnu 1945 a v platnost vstoupila v říjnu. Zakládajících států bylo jedenapadesát, mezi nimi Československo."}, {"t": "q", "d": 3, "q": "Ve kterém roce vzniklo NATO?", "o": ["1945", "1949", "1955"], "a": "1949", "n": "", "e": "Severoatlantická aliance vznikla ve Washingtonu roku 1949 s dvanácti zakládajícími státy. Česko do ní vstoupilo v roce 1999."}, {"t": "q", "d": 3, "q": "Ve kterém roce byla podepsána Maastrichtská smlouva?", "o": ["1989", "1992", "1995"], "a": "1992", "n": "", "e": "Smlouva podepsaná v nizozemském Maastrichtu proměnila Evropská společenství v Evropskou unii. Nastartovala i cestu ke společné měně."}, {"t": "q", "d": 4, "q": "Ve kterém roce vznikla Varšavská smlouva?", "o": ["1949", "1955", "1961"], "a": "1955", "n": "", "e": "Varšavská smlouva vznikla roku 1955 jako sovětská odpověď na vstup Německa do NATO. Zanikla v roce 1991."}, {"t": "q", "d": 5, "q": "Ve kterém roce byla podepsána Schengenská dohoda?", "o": ["1975", "1985", "1995"], "a": "1985", "n": "", "e": "Dohoda byla pod <script>
const BG={"Historie":"historie","Geografie":"geografie","Fauna":"fauna","Flóra":"flora",

  "Jídlo a pití":"jidlo","Česko":"cesko"};
const bgStyle=n=>BG[n]
  ? ` style="background-image:linear-gradient(rgba(247,244,238,.62),rgba(247,244,238,.62)),url('pozadi/${BG[n]}.png')"`
  : "";

const main=document.getElementById("main"),roundtag=document.getElementById("roundtag"),
      counter=document.getElementById("counter"),sub=document.getElementById("sub");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const el=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;};

const slides=[{kind:"title"}];
BLOCKS.forEach((block,bi)=>{
  block.forEach(round=>{
    slides.push({kind:"round",block:bi+1,name:round.name,count:round.items.length});
    round.items.forEach((it,i)=>slides.push({kind:it.t,block:bi+1,name:round.name,no:i+1,of:round.items.length,it,
                                            media:round.media,audio:!!round.audio}));
  });
  slides.push({kind:"timer",block:bi+1,names:block.map(r=>r.name)});
  block.forEach(round=>slides.push({kind:"sol",block:bi+1,name:round.name,items:round.items}));
  slides.push({kind:"score",block:bi+1});
});
slides.push({kind:"end"});

function optsHTML(o){
  return `<div class="hintlabel">Nápověda — s možnostmi platí správná odpověď za půl bodu</div>`
    + o.map((x,k)=>`<div class="opt"><b>${"ABC"[k]}</b><span>${esc(x)}</span></div>`).join("");
}

slides.forEach(s=>{
  let n;
  if(s.kind==="title"){
    n=el(`<section class="slide"><div class="big">
      <h1>Kvíz 4<em>10 okruhů, 50 otázek</em></h1>

    n=el(`<section class="slide${bgClass(s.name)}"${bgStyle(s.name)}><div class="big">

  }else if(s.kind==="q"){
    const it=s.it;

    </div></section>`);

                   :`<div class="play"></div><p>Klikni nebo zmáčkni mezerník</p>`}

      <h1 style="font-size:clamp(28px,4vw,52px)">Řešení<em style="font-size:.5em">${esc(s.name)}</em></h1>
      <div class="sol" style="margin-top:26px">${s.items.map((it,i)=>`
        <div class="row"><div class="n">${i+1}</div><div class="q">${esc(it.q)}</div><div class="a">${esc(it.a)}${it.n?`<span style="display:block;font-weight:400;font-size:15px;color:var(--muted);margin-top:4px">${esc(it.n)}</span>`:""}</div>
          ${it.e?`<div class="e">${esc(it.e)}</div>`:""}</div>`).join("")}
      </div></div></section>`);
  }else if(s.kind==="score"){
    n=el(`<section class="slide"><div class="big" style="max-width:1040px">
      <h1 style="font-size:clamp(28px,4vw,52px)">Průběžné skóre<em style="font-size:.5em">po ${s.block}. bloku</em></h1>
      <div class="scorebox" style="margin-top:22px"></div>
      <div class="tools">
        <button data-act="add">Přidat tým</button>
        <button data-act="del">Odebrat poslední</button>
        <button data-act="clear">Vymazat body</button>
      </div></div></section>`);
  }else{
    n=el(`<section class="slide"><div class="big">
      <h1>Konec kvízu<em>Sečtěte body</em></h1>
      <p>Skóre za všech pět bloků je na posledním skóre slidu. Šipkou zpět se k němu dostaneš.</p></div></section>`);
  }
  main.appendChild(n); s.node=n;
});

/* skóre – editovatelná tabulka, drží se i po zavření souboru */
const SKEY="boubin-skore-4";
let teams=[{n:"Tým 1",p:["","","","",""]},{n:"Tým 2",p:["","","","",""]},{n:"Tým 3",p:["","","","",""]}];
try{const raw=localStorage.getItem(SKEY); if(raw)teams=JSON.parse(raw);}catch(e){}
const saveScore=()=>{try{localStorage.setItem(SKEY,JSON.stringify(teams));}catch(e){}};
const sumTeam=t=>t.p.reduce((a,v)=>a+(Number(v)||0),0);

function renderScore(node,block){
  const box=node.querySelector(".scorebox");
  box.innerHTML=`<table class="score"><thead><tr><th>Tým</th>
      ${[1,2,3,4,5].map(b=>`<th>Blok ${b}</th>`).join("")}<th>Celkem</th></tr></thead>
    <tbody>${teams.map((t,ti)=>`<tr>
      <td><input data-t="${ti}" data-f="n" value="${esc(t.n)}"></td>
      ${t.p.map((v,bi)=>`<td class="${bi+1===block?"here":""}"><input data-t="${ti}" data-f="${bi}" inputmode="numeric" value="${esc(v)}"></td>`).join("")}
      <td class="total">${sumTeam(t)}</td></tr>`).join("")}</tbody></table>`;
}
main.addEventListener("input",e=>{
  const i=e.target; if(!i.dataset.t)return;
  const t=teams[+i.dataset.t];
  if(i.dataset.f==="n")t.n=i.value; else t.p[+i.dataset.f]=i.value;
  const row=i.closest("tr"); row.querySelector(".total").textContent=sumTeam(t);
  saveScore();
});
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const act=b.dataset.act;
  if(act==="add"&&teams.length<10)teams.push({n:"Tým "+(teams.length+1),p:["","","","",""]});
  else if(act==="del"&&teams.length>1)teams.pop();
  else if(act==="clear")teams.forEach(t=>t.p=["","","","",""]);
  saveScore(); renderScore(cur().node,cur().block);
});

/* přehrávání – soubory se párují podle podoby názvu, ne přesné shody */
const MEDIA={};                       // normalizovaný název -> {url,name}
const FOLDERS=["","videos/","hudba/","media/","./"];
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
                .replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]/g,"");
function fromPicked(name){
  const k=norm(name);
  if(MEDIA[k])return MEDIA[k].url;
  let best=null,score=0;
  for(const key in MEDIA){
    let s=0;
    if(key.includes(k)||k.includes(key)) s=Math.min(key.length,k.length);
    else{ // shoda na začátku názvu
      let i=0; while(i<key.length&&i<k.length&&key[i]===k[i])i++;
      if(i>=10)s=i;
    }
    if(s>score){score=s;best=MEDIA[key];}
  }
  return best?best.url:null;
}
function nameVariants(n){
  const v=[n, n.replace(/_-_/g," - ").replace(/_/g," "), n.replace(/_/g," ")];
  return [...new Set(v)];
}
function urlsFor(s){
  const out=[];
  if(s.manual)out.push(s.manual);
  const names=[].concat(...s.it.f.map(nameVariants));
  names.forEach(n=>{
    const picked=fromPicked(n); if(picked)out.push(picked);
    out.push(s.media+encodeURIComponent(n));
    FOLDERS.forEach(f=>{const u=f+encodeURIComponent(n); if(!out.includes(u))out.push(u);});
  });
  return out;
}
function load(s,force){
  const v=s.node.querySelector("video"); if(!v)return;
  if(v.dataset.bound&&!force)return;
  const err=s.node.querySelector(".err"), cover=s.node.querySelector(".cover");
  if(!v.dataset.bound){
    v.addEventListener("play",()=>cover.classList.add("playing"));
    v.addEventListener("pause",()=>cover.classList.remove("playing"));
    v.addEventListener("ended",()=>cover.classList.remove("playing"));
    v.addEventListener("loadeddata",()=>err.classList.remove("on"));
    v.addEventListener("error",()=>tryNext(v));
  }
  v.dataset.bound="1";
  v.dataset.list=JSON.stringify(urlsFor(s)); v.dataset.i="0";
  err.classList.remove("on");
  tryNext(v);
}
function tryNext(v){
  const list=JSON.parse(v.dataset.list||"[]"); let i=+(v.dataset.i||0);
  if(i>=list.length){v.closest(".frame").querySelector(".err").classList.add("on");return;}
  v.dataset.i=String(i+1);
  v.src=list[i]; v.load();
}
function play(withVideo){
  const s=cur(); if(s.kind!=="m")return;
  const v=s.node.querySelector("video"), cover=s.node.querySelector(".cover");
  cover.classList.toggle("off", s.audio ? withVideo : true);
  v.currentTime=0; v.play().catch(()=>{});
}
document.getElementById("btnPick").onclick=()=>document.getElementById("pick").click();
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-err]"); if(!b)return;
  if(b.dataset.err==="folder")document.getElementById("pick").click();
  else{const inp=document.getElementById("pickone"); inp.dataset.slide=String(idx); inp.value=""; inp.click();}
});
document.getElementById("pickone").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const s=slides[+e.target.dataset.slide];
  s.manual=URL.createObjectURL(f);
  MEDIA[norm(f.name)]={url:s.manual,name:f.name};
  load(s,true);
};
function registerFiles(files){
  let seen=0,added=0;
  [...files].forEach(f=>{
    seen++;
    if(!/\.(mp4|m4v|webm|mov|mkv|mp3|m4a|ogg|wav)$/i.test(f.name))return;
    MEDIA[norm(f.name)]={url:URL.createObjectURL(f),name:f.name}; added++;
  });
  const clips=slides.filter(s=>s.kind==="m");
  clips.forEach(s=>{const v=s.node.querySelector("video"); if(v)v.dataset.bound="";});
  const missing=clips.filter(s=>!fromPicked(s.it.f[0]));
  const box=document.getElementById("pickinfo");
  box.hidden=false;
  if(!seen){box.innerHTML="Nepřišly žádné soubory. Zkus místo výběru složky přetáhnout mp3 nebo mp4 soubory myší přímo sem do okna.";}
  else if(missing.length){
    box.innerHTML=`Prohlédnuto ${seen} souborů, z toho ${added} přehratelných. Nespárováno ${missing.length} z ${clips.length} ukázek: `
      +missing.map(s=>esc(s.name+" "+s.no)).join(", ")+". Zbylé lze přiřadit tlačítkem u dané ukázky.";
  }else box.innerHTML=`Načteno ${added} souborů, všech ${clips.length} ukázek je připraveno.`;
  if(cur().kind==="m"||cur().kind==="m")load(cur(),true);
}
document.getElementById("pick").onchange=e=>registerFiles(e.target.files);

/* přetažení souborů nebo složky myší kamkoli do okna */
document.addEventListener("dragover",e=>{e.preventDefault();});
document.addEventListener("drop",async e=>{
  e.preventDefault();
  const items=[...(e.dataTransfer.items||[])];
  const out=[];
  const walk=entry=>new Promise(res=>{
    if(!entry)return res();
    if(entry.isFile)entry.file(f=>{out.push(f);res();},()=>res());
    else if(entry.isDirectory){
      const rd=entry.createReader();
      const read=()=>rd.readEntries(async ents=>{
        if(!ents.length)return res();
        for(const en of ents)await walk(en);
        read();
      },()=>res());
      read();
    }else res();
  });
  const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){for(const en of entries)await walk(en);}
  else out.push(...(e.dataTransfer.files||[]));
  registerFiles(out);
});

/* odpočet */
let tick=null;
function startClock(s){
  const out=s.node.querySelector(".clock"); let left=SECONDS;
  const draw=()=>{out.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
                  out.classList.toggle("low",left<=15);};
  clearInterval(tick); draw();
  tick=setInterval(()=>{left--; draw(); if(left<=0)clearInterval(tick);},1000);
}

let idx=0;
const btnA=document.getElementById("btnA"),btnB=document.getElementById("btnB"),
      btnHint=document.getElementById("btnHint"),btnAnswer=document.getElementById("btnAnswer"),
      btnPrev=document.getElementById("btnPrev"),btnNext=document.getElementById("btnNext"),
      btnFull=document.getElementById("btnFull");
const cur=()=>slides[idx];

function render(){
  slides.forEach((s,i)=>s.node.classList.toggle("on",i===idx));
  document.querySelectorAll("video").forEach(v=>{if(!v.paused)v.pause();});
  clearInterval(tick);
  const s=cur();
  const label = s.kind==="title"?"Úvod":(s.kind==="end"?"Konec":(s.name||("Blok "+s.block)));
  roundtag.innerHTML=`<i>${s.block||"•"}</i><span>${esc(label)}</span>`;
  counter.textContent=(s.kind==="q"||s.kind==="m")?`Otázka ${s.no} z ${s.of}`:"";
  sub.textContent = s.block?`Blok ${s.block} z 5`:"10 okruhů";
  if(s.kind==="m"){load(s); s.node.querySelector(".cover").classList.remove("off");}
  if(s.kind==="timer")startClock(s);
  if(s.kind==="score")renderScore(s.node,s.block);
  const isQ=s.kind==="q"||s.kind==="m";
  btnA.disabled=!(s.kind==="m"||s.kind==="timer");
  btnA.textContent=s.kind==="timer"?"Spustit čas":"Přehrát";
  btnB.disabled=!(s.kind==="m"&&s.audio);
  btnHint.disabled=!isQ; btnAnswer.disabled=!isQ;
  btnPrev.disabled=idx===0; btnNext.disabled=idx===slides.length-1;
}
const toggle=sel=>{const s=cur(); const n=s.node.querySelector(sel); if(n)n.classList.toggle(sel===".opts"?"hidden":"on");};
const go=d=>{const n=idx+d; if(n>=0&&n<slides.length){idx=n;render();}};

btnA.onclick=()=>{const s=cur(); s.kind==="timer"?startClock(s):play(false);};
btnB.onclick=()=>play(true);
btnHint.onclick=()=>toggle(".opts");
btnAnswer.onclick=()=>toggle(".reveal");
btnPrev.onclick=()=>go(-1);
btnNext.onclick=()=>go(1);
btnFull.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
main.addEventListener("click",e=>{if(e.target.closest(".play"))play(false);});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key===" "){e.preventDefault(); const s=cur(); s.kind==="timer"?startClock(s):play(false);}
  else if(e.key==="v"||e.key==="V"){play(true);}
  else if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1);}
  else if(e.key==="n"||e.key==="N"){toggle(".opts");}
  else if(e.key==="o"||e.key==="O"){toggle(".reveal");}
  else if(e.key==="f"||e.key==="F"){btnFull.click();}
});
render();
</script>
