<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Cyklo &amp; Ski mapa – cyklotrasy a sjezdovky v ČR s ubytováním, půjčovnami a infocentry v okolí; evidence oslovení provozovatelů.">
  <title>Cyklo &amp; Ski mapa</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🚲⛷️</span>
        <div class="brand-text">
          <strong>Cyklo &amp; Ski mapa</strong>
          <small id="meta-line">Načítám data…</small>
        </div>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Oblast"></nav>
      <div class="top-actions">
        <input id="search" class="input search" type="search" placeholder="Hledat místo, trasu, areál, obec…" autocomplete="off" aria-label="Hledat">
        <button id="btn-view" class="btn" type="button" title="Přepnout mapu / tabulku">Tabulka</button>
        <button id="btn-export" class="btn" type="button" title="Export aktuálního výběru do CSV (Excel)">Export CSV</button>
        <button id="btn-stav" class="btn" type="button" title="Zálohovat / načíst stav oslovení">Stav oslovení</button>
        <button id="btn-theme" class="btn btn-icon" type="button" title="Tmavý / světlý režim" aria-label="Přepnout motiv">◐</button>
      </div>
    </header>

    <div class="body">
      <aside class="filters" id="filters" aria-label="Filtry">
        <div class="boot" id="boot">Načítám data (asi 20 MB)… chvíli to trvá.</div>
      </aside>

      <main class="map-wrap" id="map-wrap">
        <div id="map" class="map" role="application" aria-label="Mapa"></div>
        <div id="legend" class="legend" aria-label="Legenda"></div>
        <div id="table-wrap" class="table-wrap hidden"></div>
      </main>

      <aside class="side" id="side" aria-label="Seznam a detail">
        <div class="side-tabs" id="side-tabs"></div>
        <div class="side-list" id="side-list"></div>
        <div class="side-detail hidden" id="side-detail"></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modal-root"></div>

  <noscript><p style="padding:24px">Aplikace vyžaduje zapnutý JavaScript.</p></noscript>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="lib/geo.js"></script>
  <script src="lib/csv.js"></script>
  <script src="lib/contacts.js"></script>
  <script src="lib/stav.js"></script>
  <script src="data/meta.js"></script>
  <script src="data/hranice.js"></script>
  <script src="data/ski.js"></script>
  <script src="data/trasy.js"></script>
  <script src="data/mista.js"></script>
  <script src="data/enrich.js" onerror="window.CSM_DATA = window.CSM_DATA || {}; window.CSM_DATA.enrich = window.CSM_DATA.enrich || {};"></script>
  <script src="app.js"></script>
</body>
</html>
