#cloud-config
# Hetzner Cloud → při zakládání serveru vložit do pole „Cloud config“ (user data). Server se po startu sám
# připraví: Docker, firewall, repozitář v /opt/Doma. Pak už jen:
#   ssh root@IP
#   bash /opt/Doma/cyklo-ski-mapa/deploy/hetzner.sh instalace mapa.vase-domena.cz
# Pokud aplikace zatím není v hlavní větvi repa, přidejte před `git clone` větev: git clone -b NAZEV_VETVE …
package_update: true
package_upgrade: true
packages:
  - git
  - curl
  - ca-certificates
  - ufw
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - git clone https://github.com/ladasuchan1-cmd/Doma.git /opt/Doma
